services:
  postgres:
    image: postgres:16-alpine
    container_name: lodelabels-db
    environment:
      POSTGRES_DB: lodelabels
      POSTGRES_USER: lodelabels
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lodelabels-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: